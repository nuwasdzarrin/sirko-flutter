# PRODUKSI bagian 3: sesi tersimpan, Keluar, password salah, masuk pakai
# nomor WA, masuk OFFLINE (mode pesawat), lalu otomatis online lagi.
appId: com.sirko.app
name: "P02 Produksi - login email-WA, offline & online lagi"
---
- startRecording: p02_login_offline
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible: "Beranda.*"
    timeout: 60000

- tapOn: "Lainnya.*"
- scrollUntilVisible:
    element: "Keluar"
    direction: DOWN
- tapOn: "Keluar"
- extendedWaitUntil:
    visible: "Masuk ke Sirko"
    timeout: 15000

# Password salah
- runFlow:
    file: ../subflows/isi_field_terisi.yaml
    env: { FIELD: "Email atau nomor WA", TEXT: "${EMAIL}" }
- runFlow:
    file: ../subflows/isi_field.yaml
    env: { FIELD: "Password", TEXT: "salahsalah" }
- tapOn: "Masuk"
- extendedWaitUntil:
    visible: ".*(salah|tidak cocok).*"
    timeout: 20000
- takeScreenshot: p02_password_salah

# Masuk pakai nomor WA
- runFlow:
    file: ../subflows/isi_field_terisi.yaml
    env: { FIELD: "Email atau nomor WA", TEXT: "${PHONE}" }
- runFlow:
    file: ../subflows/isi_field.yaml
    env: { FIELD: "Password", TEXT: "${PASSWORD}" }
- tapOn: "Masuk"
- extendedWaitUntil:
    visible: "Beranda.*"
    timeout: 40000

# Offline
- tapOn: "Lainnya.*"
- scrollUntilVisible:
    element: "Keluar"
    direction: DOWN
- tapOn: "Keluar"
- extendedWaitUntil:
    visible: "Masuk ke Sirko"
    timeout: 15000
- setAirplaneMode: enabled
- runFlow:
    file: ../subflows/isi_field_terisi.yaml
    env: { FIELD: "Email atau nomor WA", TEXT: "${EMAIL}" }
- runFlow:
    file: ../subflows/isi_field.yaml
    env: { FIELD: "Password", TEXT: "${PASSWORD}" }
- tapOn: "Masuk"
- extendedWaitUntil:
    visible: "Beranda.*"
    timeout: 60000
- takeScreenshot: p02_masuk_offline
- setAirplaneMode: disabled

# Online lagi otomatis
- runFlow:
    file: ../subflows/buka_menu_lainnya.yaml
    env: { MENU: "Sinkronisasi" }
- extendedWaitUntil:
    visible: ".*Tersinkron.*"
    timeout: 120000
- assertNotVisible: "Masuk ulang"
- takeScreenshot: p02_online_lagi
- stopRecording

# Buka tab Lainnya → ketuk menu → pastikan layar tujuan tampil.
# Param env: MENU, EXPECT.
appId: com.sirko.app
---
- tapOn: "Lainnya.*Tab 5.*"
# Halaman bisa masih tergulir dari kunjungan sebelumnya → cari ke bawah,
# lalu ke atas.
- runFlow:
    when:
      notVisible: ${MENU}
    commands:
      - scrollUntilVisible:
          element: ${MENU}
          direction: DOWN
          timeout: 10000
          optional: true
- runFlow:
    when:
      notVisible: ${MENU}
    commands:
      - scrollUntilVisible:
          element: ${MENU}
          direction: UP
          timeout: 10000
- tapOn: ${MENU}
- extendedWaitUntil:
    visible: ${EXPECT}
    timeout: 10000
- runFlow:
    when:
      visible: "Kembali"
    commands:
      - tapOn: "Kembali"

# Buka ulang app (data tetap) sebagai PEMILIK. Sesi pemilik tersimpan →
# biasanya langsung Beranda. Bila tertahan di:
#  - layar PIN karyawan (setelah "Ganti pengguna") → "Masuk sebagai pemilik"
#    + password;
#  - layar Masuk (setelah Keluar) → email + password.
# Akun: e2e${RUN_ID}@toko.id / rahasia123 (TC-01).
appId: com.sirko.app
---
# Lembar berbagi sistem (ekspor XLSX/PDF) tak ikut tertutup saat app
# dihentikan → tutup dulu.
- runFlow:
    when:
      visible: "Sharing.*"
    commands:
      - pressKey: Back
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible: "(Beranda.*|Masuk ke Sirko|Masuk karyawan)"
    timeout: 60000
- runFlow:
    when:
      visible: "Masuk karyawan"
    commands:
      - tapOn: "Masuk sebagai pemilik"
      - runFlow:
          file: isi_field.yaml
          env: { FIELD: "Password", TEXT: "rahasia123" }
      - tapOn: "Masuk"
- runFlow:
    when:
      visible: "Masuk ke Sirko"
    commands:
      - runFlow:
          file: isi_field_terisi.yaml
          env: { FIELD: "Email atau nomor WA", TEXT: "e2e${RUN_ID}@toko.id" }
      - runFlow:
          file: isi_field.yaml
          env: { FIELD: "Password", TEXT: "rahasia123" }
      - tapOn: "Masuk"
- extendedWaitUntil:
    visible: "Beranda.*"
    timeout: 30000

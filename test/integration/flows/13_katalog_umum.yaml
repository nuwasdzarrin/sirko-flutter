# TC-13 Katalog Umum: cache lokal dari seed (offline), cari nama & barcode,
# tab Online & "Usulkan" butuh login cloud, validasi form login cloud.
# Sengaja TIDAK mengirim kredensial ke backend produksi (tanpa akun uji);
# login cloud/sync/kontribusi sukses perlu akun QA khusus.
appId: com.sirko.app
name: "13 Katalog umum & guard cloud"
tags: [katalog]
---
- startRecording: 13_katalog_umum
- runFlow: ../subflows/login_pemilik.yaml
- runFlow:
    file: ../subflows/buka_menu_lainnya.yaml
    env: { MENU: "Katalog Umum" }
- extendedWaitUntil:
    visible: "Cache.*Tab 1 dari 2"
    timeout: 10000
- assertVisible: "Daftar katalog produk umum milik Sirko.*"

# Cari nama (seed lokal)
- runFlow:
    file: ../subflows/isi_field.yaml
    env: { FIELD: "Cari nama / merek / barcode.*", TEXT: "indomie" }
- extendedWaitUntil:
    visible: ".* indomie . Makanan . 8994963\\d{6}"
    timeout: 10000
- takeScreenshot: 13_cari_indomie
# Cari barcode
- runFlow:
    file: ../subflows/kosongkan_field.yaml
    env: { TEXT: "indomie" }
- runFlow:
    file: ../subflows/isi_field.yaml
    env: { FIELD: "Cari nama / merek / barcode.*", TEXT: "8997020180961" }
- extendedWaitUntil:
    visible: "3 In 1 Oats Vanilla Quacker . Makanan . 8997020180961"
    timeout: 10000

# Online butuh cloud
- tapOn: "Online.*Tab 2 dari 2"
- extendedWaitUntil:
    visible: "Belum terhubung ke cloud.*"
    timeout: 10000
- assertVisible: "Hubungkan ke Cloud"
- takeScreenshot: 13_online_belum_login

# Usulkan tanpa login → diarahkan ke layar login cloud
- tapOn: "Usulkan"
- extendedWaitUntil:
    visible: "Masuk dengan akun cloud Sirko.*"
    timeout: 10000
# Validasi klien: field kosong
- tapOn: "Masuk"
- extendedWaitUntil:
    visible: "Isi email/HP dan password."
    timeout: 5000
- takeScreenshot: 13_login_cloud_validasi
- tapOn: "Kembali"
- tapOn: "Kembali"
- stopRecording

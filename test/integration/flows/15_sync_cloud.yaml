# TC-15 Sinkronisasi cloud (SYNC.md §8) dengan alur akun baru: akun pemilik
# sudah masuk sejak TC-01 → transaksi baru otomatis terkirim ("Tersinkron");
# lalu simulasi HP baru (hapus data app) → Masuk email + password → data toko
# pulih otomatis, pemilik langsung di Beranda (tanpa PIN, tanpa menu
# "Pulihkan dari Cloud" terpisah).
# Prasyarat: TC-01..04 (toko, 3 produk; INV-0001 sudah void).
# Backend: APK dengan --dart-define=SIRKO_API_BASE=<backend uji LOKAL>.
appId: com.sirko.app
name: "15 Sinkronisasi cloud - sync otomatis & pulih saat masuk"
tags: [sync]
env:
  RUN_ID: "0000000000"
---
- startRecording: 15_sync_cloud
- evalScript: ${output.email = 'e2e' + RUN_ID + '@toko.id'}
- runFlow: ../subflows/login_pemilik.yaml

# --- Transaksi baru ---
- tapOn: "Kasir.*Tab 2.*"
- tapOn: "Indomie Goreng.*"
- tapOn: "Indomie Goreng.*"
- tapOn: "Bayar"
- extendedWaitUntil:
    visible: "Pembayaran"
    timeout: 5000
- tapOn: "Uang pas"
- tapOn: "Selesaikan & Cetak Struk"
- extendedWaitUntil:
    visible: "Transaksi berhasil"
    timeout: 15000
- tapOn: "Transaksi Baru"
- tapOn:
    id: "kasir_ke_beranda"

# --- Sudah terhubung → push otomatis ---
- runFlow:
    file: ../subflows/buka_menu_lainnya.yaml
    env: { MENU: "Sinkronisasi" }
- tapOn:
    text: "Sinkronkan sekarang"
    optional: true
- extendedWaitUntil:
    visible: ".*Tersinkron.*"
    timeout: 90000
- assertVisible: ".*Menunggu dikirim: 0 data.*"
- assertVisible: "Akun cloud ${output.email}"
- assertNotVisible: "Daftar akun cloud"
- takeScreenshot: 15_tersinkron

# --- HP baru: hapus semua data app → masuk → data pulih ---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Masuk ke Sirko"
    timeout: 90000
- assertNotVisible: "Pulihkan dari Cloud"
- runFlow:
    file: ../subflows/isi_field.yaml
    env: { FIELD: "Email atau nomor WA", TEXT: "${output.email}" }
- runFlow:
    file: ../subflows/isi_field.yaml
    env: { FIELD: "Password", TEXT: "rahasia123" }
- tapOn:
    text: "Masuk"
    index: 1
- extendedWaitUntil:
    visible: "Beranda.*"
    timeout: 120000
- takeScreenshot: 15_pulih_beranda

# Data toko kembali
- tapOn: "Produk.*Tab 3.*"
- extendedWaitUntil:
    visible: "Aqua 600ml.*"
    timeout: 60000
- assertVisible: "Indomie Goreng .* Stok \\d+ pcs"
- assertVisible: "Gula Pasir 1kg.*"
- takeScreenshot: 15_produk_pulih
- tapOn: "Kasir.*Tab 2.*"
- tapOn:
    id: "kasir_riwayat"
- extendedWaitUntil:
    visible: ".*INV-\\d{8}-0002.*"
    timeout: 10000
- takeScreenshot: 15_riwayat_pulih
- tapOn: "Kembali"
- tapOn:
    id: "kasir_ke_beranda"

# Status sync di HP baru
- runFlow:
    file: ../subflows/buka_menu_lainnya.yaml
    env: { MENU: "Sinkronisasi" }
- extendedWaitUntil:
    visible: ".*Tersinkron.*"
    timeout: 60000
- assertVisible: "Akun cloud ${output.email}"
- takeScreenshot: 15_status_hp_baru
- stopRecording

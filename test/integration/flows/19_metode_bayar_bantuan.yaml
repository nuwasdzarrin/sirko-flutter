# TC-19 Pengaturan metode bayar (pemilik) & Hubungi Bantuan.
#  - Matikan Transfer & split → di kasir Transfer tak bisa dipilih dan tombol
#    "Tambah metode (split)" hilang → kembalikan pengaturan.
#  - Non-tunai melebihi total → peringatan, tak bisa diselesaikan.
#  - Lainnya → kartu "Hubungi Bantuan" tampil.
# Prasyarat: produk Aqua 600ml (TC-03). Jalankan setelah 15 (menambah nota).
appId: com.sirko.app
name: "19 Metode bayar & Hubungi Bantuan"
tags: [kasir]
---
- startRecording: 19_metode_bayar_bantuan
- runFlow: ../subflows/login_pemilik.yaml

# --- Pengaturan: matikan Transfer & split ---
- runFlow:
    file: ../subflows/buka_menu_lainnya.yaml
    env: { MENU: "Pengaturan" }
- scrollUntilVisible:
    element: "Metode pembayaran.*"
    direction: DOWN
- tapOn: "Metode pembayaran.*"
- extendedWaitUntil:
    visible: "Boleh bayar campuran \\(split\\).*"
    timeout: 10000
- tapOn: "Transfer"
- tapOn: "Boleh bayar campuran \\(split\\).*"
- assertVisible:
    text: "Boleh bayar campuran \\(split\\).*"
    checked: false
- takeScreenshot: 19_pengaturan_metode
- back

# --- Kasir: Transfer & split tak tersedia ---
- tapOn: "Kasir.*Tab 2.*"
- tapOn: "Aqua 600ml.*"
- tapOn: "Bayar"
- extendedWaitUntil:
    visible: "Pembayaran"
    timeout: 5000
- assertNotVisible: "Tambah metode \\(split\\)"
- tapOn: "Tunai"
- extendedWaitUntil:
    visible: "QRIS"
    timeout: 5000
- assertNotVisible: "Transfer"
- takeScreenshot: 19_metode_terbatas
- tapOn: "QRIS"

# Non-tunai melebihi total → peringatan, tombol selesai mati
- runFlow:
    file: ../subflows/isi_field.yaml
    env: { FIELD: "Nominal QRIS", TEXT: "50000" }
- extendedWaitUntil:
    visible: ".*Non-tunai.*melebihi total.*"
    timeout: 5000
- assertVisible:
    text: "Selesaikan & Cetak Struk"
    enabled: false
- takeScreenshot: 19_nontunai_lebih

# Bayar benar: uang pas tunai
- tapOn: "QRIS"
- tapOn: "Tunai"
- tapOn: "Uang pas"
- tapOn: "Selesaikan & Cetak Struk"
- extendedWaitUntil:
    visible: "Transaksi berhasil"
    timeout: 20000
- tapOn: "Transaksi Baru"
- tapOn:
    id: "kasir_ke_beranda"

# --- Kembalikan pengaturan ---
- runFlow:
    file: ../subflows/buka_menu_lainnya.yaml
    env: { MENU: "Pengaturan" }
- scrollUntilVisible:
    element: "Metode pembayaran.*"
    direction: DOWN
- tapOn: "Metode pembayaran.*"
- extendedWaitUntil:
    visible: "Boleh bayar campuran \\(split\\).*"
    timeout: 10000
- tapOn: "Transfer"
- tapOn: "Boleh bayar campuran \\(split\\).*"
- assertVisible:
    text: "Boleh bayar campuran \\(split\\).*"
    checked: true
- back

# --- Hubungi Bantuan --- (cukup pastikan tampil; mengetuknya membuka
# WhatsApp/Chrome di emulator — Chrome first-run bisa ANR & mengganggu flow
# berikutnya)
- tapOn: "Lainnya.*"
- scrollUntilVisible:
    element: "Hubungi Bantuan.*"
    direction: DOWN
    timeout: 15000
- assertVisible: "Hubungi Bantuan.*Chat WhatsApp Layanan Admin Sirko.*"
- takeScreenshot: 19_hubungi_bantuan
- stopRecording

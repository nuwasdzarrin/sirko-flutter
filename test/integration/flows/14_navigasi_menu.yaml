# TC-14 Navigasi: 5 tab bottom navbar, 10 menu tab "Lainnya", 8 pintasan
# Beranda, layar Stok Masuk (scan kamera tak diuji — gap G2), mode fokus Kasir.
appId: com.sirko.app
name: "14 Navigasi tab, menu & pintasan"
tags: [smoke, navigasi]
---
- startRecording: 14_navigasi_menu
- runFlow: ../subflows/login_pemilik.yaml

# --- Bottom navbar ---
- assertVisible: "Beranda Tab 1 dari 5"
- tapOn: "Produk.*Tab 3.*"
- assertVisible: "Cari nama atau barcode.*"
- tapOn: "Laporan.*Tab 4.*"
- assertVisible: "Export PDF"
- tapOn: "Kasir.*Tab 2.*"
# Mode fokus: navbar disembunyikan, tombol Beranda di AppBar (id kasir_ke_beranda)
- assertNotVisible: "Lainnya.*Tab 5.*"
- tapOn:
    id: "kasir_ke_beranda"
- extendedWaitUntil:
    visible: "Beranda Tab 1 dari 5"
    timeout: 5000

# --- Menu tab Lainnya ---
- runFlow:
    file: ../subflows/cek_menu_lainnya.yaml
    env: { MENU: "Katalog Umum", EXPECT: "Cache.*Tab 1 dari 2" }
- runFlow:
    file: ../subflows/cek_menu_lainnya.yaml
    env: { MENU: "Pelanggan", EXPECT: "Cari nama atau telepon.*" }
- runFlow:
    file: ../subflows/cek_menu_lainnya.yaml
    env: { MENU: "Shift / Bill", EXPECT: "Riwayat Shift" }
- runFlow:
    file: ../subflows/cek_menu_lainnya.yaml
    env: { MENU: "Kas / Wallet", EXPECT: "Total Saldo Semua Kas.*" }
- runFlow:
    file: ../subflows/cek_menu_lainnya.yaml
    env: { MENU: "Supplier", EXPECT: "C CV Sumber Rejeki.*" }
- runFlow:
    file: ../subflows/cek_menu_lainnya.yaml
    env: { MENU: "Pembelian", EXPECT: "Kulakan" }
- runFlow:
    file: ../subflows/cek_menu_lainnya.yaml
    env: { MENU: "Stok Opname", EXPECT: "Opname Baru" }
- runFlow:
    file: ../subflows/cek_menu_lainnya.yaml
    env: { MENU: "Ringkasan Karyawan", EXPECT: "R Rina Kasir.*" }
- runFlow:
    file: ../subflows/cek_menu_lainnya.yaml
    env: { MENU: "Karyawan", EXPECT: "B Budi Pemilik @pemilik.*" }
- runFlow:
    file: ../subflows/cek_menu_lainnya.yaml
    env: { MENU: "Pengaturan", EXPECT: "Wajib buka shift sebelum transaksi.*" }
- takeScreenshot: 14_lainnya

# --- Pintasan Beranda ---
- tapOn: "Beranda.*Tab 1.*"
- extendedWaitUntil:
    visible: "Pintasan"
    timeout: 5000
- takeScreenshot: 14_pintasan
- runFlow:
    file: ../subflows/cek_tujuan.yaml
    env: { LABEL: "Buka Shift", EXPECT: "Riwayat Shift" }
- runFlow:
    file: ../subflows/cek_tujuan.yaml
    env: { LABEL: "Kas Bon", EXPECT: "Daftar Kas Bon" }
- runFlow:
    file: ../subflows/cek_tujuan.yaml
    env: { LABEL: "Stok Masuk", EXPECT: "Belum ada barang di sesi ini" }
- runFlow:
    file: ../subflows/cek_tujuan.yaml
    env: { LABEL: "Pembelian", EXPECT: "Kulakan" }
- runFlow:
    file: ../subflows/cek_tujuan.yaml
    env: { LABEL: "Pelanggan", EXPECT: "Cari nama atau telepon.*" }
- runFlow:
    file: ../subflows/cek_tujuan.yaml
    env: { LABEL: "Kas", EXPECT: "Total Saldo Semua Kas.*" }
- runFlow:
    file: ../subflows/cek_tujuan.yaml
    env: { LABEL: "Stok Opname", EXPECT: "Opname Baru" }
- runFlow:
    file: ../subflows/cek_tujuan.yaml
    env: { LABEL: "Supplier", EXPECT: "C CV Sumber Rejeki.*" }
- stopRecording

# TC-18c Riwayat PPOB — token yang tadi "DIPROSES" kini SUKSES (hook sebelum
# flow: admin mengisi token). Token tampil di Riwayat PPOB, order sudah
# "Tercatat di nota" (tak perlu dicatat ulang), dan item di nota kasir
# otomatis berisi token (dibuka dari Riwayat transaksi).
appId: com.sirko.app
name: "18c PPOB - riwayat, token mengisi nota"
tags: [ppob]
---
- startRecording: 18c_ppob_riwayat
- runFlow: ../subflows/login_pemilik.yaml
- tapOn: "Kasir.*Tab 2.*"
- tapOn: "PPOB.*Tab 2 dari 2"
- extendedWaitUntil:
    visible:
      id: "ppob_riwayat"
    timeout: 20000
- tapOn:
    id: "ppob_riwayat"
- extendedWaitUntil:
    visible: "Token: 1234-5678-9012-3456-7890"
    timeout: 20000
- assertVisible: ".*51234567890.*a.n. BUDI UJI.*Berhasil.*Tercatat di nota.*"
- assertNotVisible: "Catat ke kasir"
- takeScreenshot: 18c_riwayat_token
- back

# Nota terakhir: item token berisi token (diperbarui otomatis). Ikon
# riwayat transaksi ada di tab Fisik.
- tapOn: "Fisik.*Tab 1 dari 2"
- tapOn:
    id: "kasir_riwayat"
- extendedWaitUntil:
    visible: ".*INV-.*"
    timeout: 10000
- tapOn:
    text: ".*INV-.*"
    index: 0
- extendedWaitUntil:
    visible: ".*Token PLN 20.000.*Token 1234-5678-9012-3456-7890.*"
    timeout: 15000
- assertNotVisible: ".*DIPROSES.*"
- takeScreenshot: 18c_nota_berisi_token
- stopRecording

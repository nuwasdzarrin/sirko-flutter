# TC-18c Riwayat PPOB — order token yang tadi tertunda kini SUKSES (hook
# sebelum flow: admin mengisi token). Token tampil + bisa disalin, lalu
# "Catat ke kasir" → nota PPOB tanpa beli ulang → "Tercatat di nota".
appId: com.sirko.app
name: "18c PPOB - riwayat, token & catat ke kasir"
tags: [ppob]
---
- startRecording: 18c_ppob_riwayat
- runFlow: ../subflows/login_pemilik.yaml
- tapOn: "Kasir.*Tab 2.*"
- tapOn: "PPOB.*Tab 2 dari 2"
- extendedWaitUntil:
    visible:
      id: "ppob_riwayat"
    timeout: 20000
- tapOn:
    id: "ppob_riwayat"
- extendedWaitUntil:
    visible: "Token: 1234-5678-9012-3456-7890"
    timeout: 20000
- assertVisible: ".*51234567890.*a.n. BUDI UJI.*Berhasil.*"
- takeScreenshot: 18c_riwayat_token
- tapOn: "Catat ke kasir"
- runFlow:
    file: ../subflows/isi_field.yaml
    env: { FIELD: "Harga jual ke pembeli", TEXT: "25000" }
- tapOn: "Masukkan keranjang"
- extendedWaitUntil:
    visible: "Masuk keranjang.*"
    timeout: 5000
- back
# Snackbar "Masuk keranjang" menutupi tombol Bayar → tunggu hilang.
- extendedWaitUntil:
    notVisible: "Masuk keranjang.*"
    timeout: 10000
- tapOn: "Bayar"
- extendedWaitUntil:
    visible: "Pembayaran"
    timeout: 5000
- assertVisible: "Rp25.000"
- tapOn: "Uang pas"
- tapOn: "Selesaikan & Cetak Struk"
- extendedWaitUntil:
    visible: "Transaksi berhasil"
    timeout: 20000
- takeScreenshot: 18c_nota_ppob
- tapOn: "Transaksi Baru"
- tapOn:
    id: "ppob_riwayat"
- extendedWaitUntil:
    visible: ".*Berhasil.*Tercatat di nota.*"
    timeout: 20000
- stopRecording
